name: Daily Shared Cleanup

on:
  schedule:
    - cron: "0 2 * * *" # GitHub may start scheduled workflows later than this.
  workflow_dispatch:
    inputs:
      target:
        description: Target to inspect or clean
        required: true
        default: all
        type: choice
        options:
          - all
          - development
          - production
      apply:
        description: Apply cleanup (leave unchecked for a dry run)
        required: true
        default: false
        type: boolean
      force:
        description: Repeat scans even if cleanup already ran today
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate-targets:
    name: Validate ${{ matrix.target }} credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: development
          - target: production
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.KARTISERET_SHARED_CLEANUP_ENABLED == 'true')
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == matrix.target
      - uses: actions/setup-python@v6
        if: github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == matrix.target
        with:
          python-version: "3.14.2"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install backend dependencies
        if: github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == matrix.target
        run: python -m pip install --prefer-binary -r requirements.txt
      - name: Validate development credentials and access
        if: matrix.target == 'development' && (github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == matrix.target)
        env:
          TARGET: ${{ matrix.target }}
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_ROLE_KEY }}
          PUBLICATION_DATABASE_URL: ${{ secrets.DEV_PUBLICATION_DATABASE_URL }}
          PUBLICATION_DATABASE_SSL_CA_CERT: ${{ secrets.DEV_PUBLICATION_DATABASE_SSL_CA_CERT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.DEV_R2_BUCKET }}
          R2_IMAGE_ORIGIN: ${{ secrets.DEV_R2_IMAGE_ORIGIN }}
          R2_ACCESS_KEY_ID: ${{ secrets.DEV_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.DEV_R2_SECRET_ACCESS_KEY }}
          D1_DATABASE_ID: ${{ secrets.DEV_D1_DATABASE_ID }}
          D1_API_TOKEN: ${{ secrets.DEV_D1_API_TOKEN }}
          RUN_ARTIFACTS_R2_BUCKET: ${{ secrets.DEV_RUN_ARTIFACTS_R2_BUCKET }}
          RUN_ARTIFACTS_R2_ACCESS_KEY_ID: ${{ secrets.DEV_RUN_ARTIFACTS_R2_ACCESS_KEY_ID }}
          RUN_ARTIFACTS_R2_SECRET_ACCESS_KEY: ${{ secrets.DEV_RUN_ARTIFACTS_R2_SECRET_ACCESS_KEY }}
          KARTISERET_TARGET: ${{ matrix.target }}
        run: python -m backend.utils.log.shared_cleanup --target "$TARGET" --validate-only

      - name: Validate production credentials and access
        if: matrix.target == 'production' && (github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == matrix.target)
        env:
          TARGET: ${{ matrix.target }}
          SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
          PUBLICATION_DATABASE_URL: ${{ secrets.PROD_PUBLICATION_DATABASE_URL }}
          PUBLICATION_DATABASE_SSL_CA_CERT: ${{ secrets.PROD_PUBLICATION_DATABASE_SSL_CA_CERT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.PROD_R2_BUCKET }}
          R2_IMAGE_ORIGIN: ${{ secrets.PROD_R2_IMAGE_ORIGIN }}
          R2_ACCESS_KEY_ID: ${{ secrets.PROD_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.PROD_R2_SECRET_ACCESS_KEY }}
          D1_DATABASE_ID: ${{ secrets.PROD_D1_DATABASE_ID }}
          D1_API_TOKEN: ${{ secrets.PROD_D1_API_TOKEN }}
          RUN_ARTIFACTS_R2_BUCKET: ${{ secrets.PROD_RUN_ARTIFACTS_R2_BUCKET }}
          RUN_ARTIFACTS_R2_ACCESS_KEY_ID: ${{ secrets.PROD_RUN_ARTIFACTS_R2_ACCESS_KEY_ID }}
          RUN_ARTIFACTS_R2_SECRET_ACCESS_KEY: ${{ secrets.PROD_RUN_ARTIFACTS_R2_SECRET_ACCESS_KEY }}
          KARTISERET_TARGET: ${{ matrix.target }}
        run: python -m backend.utils.log.shared_cleanup --target "$TARGET" --validate-only

  cleanup:
    name: Cleanup ${{ matrix.target }}
    needs: validate-targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: development
          - target: production
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.KARTISERET_SHARED_CLEANUP_ENABLED == 'true')
    concurrency:
      group: kartiseret-shared-cleanup-${{ matrix.target }}
      cancel-in-progress: false
    env:
      TARGET: ${{ matrix.target }}
      KARTISERET_TARGET: ${{ matrix.target }}
      KARTISERET_SHARED_CLEANUP_APPLY: ${{ (github.event_name == 'schedule' && vars.KARTISERET_SHARED_CLEANUP_APPLY == 'true') || (github.event_name == 'workflow_dispatch' && inputs.apply) }}
      FORCE_CLEANUP: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == matrix.target
      - uses: actions/setup-python@v6
        if: github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == matrix.target
        with:
          python-version: "3.14.2"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install backend dependencies
        if: github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == matrix.target
        run: python -m pip install --prefer-binary -r requirements.txt
      - name: Run development shared cleanup
        if: matrix.target == 'development' && (github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == matrix.target)
        env:
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_ROLE_KEY }}
          PUBLICATION_DATABASE_URL: ${{ secrets.DEV_PUBLICATION_DATABASE_URL }}
          PUBLICATION_DATABASE_SSL_CA_CERT: ${{ secrets.DEV_PUBLICATION_DATABASE_SSL_CA_CERT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.DEV_R2_BUCKET }}
          R2_IMAGE_ORIGIN: ${{ secrets.DEV_R2_IMAGE_ORIGIN }}
          R2_ACCESS_KEY_ID: ${{ secrets.DEV_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.DEV_R2_SECRET_ACCESS_KEY }}
          D1_DATABASE_ID: ${{ secrets.DEV_D1_DATABASE_ID }}
          D1_API_TOKEN: ${{ secrets.DEV_D1_API_TOKEN }}
          RUN_ARTIFACTS_R2_BUCKET: ${{ secrets.DEV_RUN_ARTIFACTS_R2_BUCKET }}
          RUN_ARTIFACTS_R2_ACCESS_KEY_ID: ${{ secrets.DEV_RUN_ARTIFACTS_R2_ACCESS_KEY_ID }}
          RUN_ARTIFACTS_R2_SECRET_ACCESS_KEY: ${{ secrets.DEV_RUN_ARTIFACTS_R2_SECRET_ACCESS_KEY }}
        run: |
          if [[ "$FORCE_CLEANUP" == "true" ]]; then
            python -m backend.utils.log.shared_cleanup --target "$TARGET" --force
          else
            python -m backend.utils.log.shared_cleanup --target "$TARGET"
          fi

      - name: Run production shared cleanup
        if: matrix.target == 'production' && (github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == matrix.target)
        env:
          SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
          PUBLICATION_DATABASE_URL: ${{ secrets.PROD_PUBLICATION_DATABASE_URL }}
          PUBLICATION_DATABASE_SSL_CA_CERT: ${{ secrets.PROD_PUBLICATION_DATABASE_SSL_CA_CERT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.PROD_R2_BUCKET }}
          R2_IMAGE_ORIGIN: ${{ secrets.PROD_R2_IMAGE_ORIGIN }}
          R2_ACCESS_KEY_ID: ${{ secrets.PROD_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.PROD_R2_SECRET_ACCESS_KEY }}
          D1_DATABASE_ID: ${{ secrets.PROD_D1_DATABASE_ID }}
          D1_API_TOKEN: ${{ secrets.PROD_D1_API_TOKEN }}
          RUN_ARTIFACTS_R2_BUCKET: ${{ secrets.PROD_RUN_ARTIFACTS_R2_BUCKET }}
          RUN_ARTIFACTS_R2_ACCESS_KEY_ID: ${{ secrets.PROD_RUN_ARTIFACTS_R2_ACCESS_KEY_ID }}
          RUN_ARTIFACTS_R2_SECRET_ACCESS_KEY: ${{ secrets.PROD_RUN_ARTIFACTS_R2_SECRET_ACCESS_KEY }}
        run: |
          if [[ "$FORCE_CLEANUP" == "true" ]]; then
            python -m backend.utils.log.shared_cleanup --target "$TARGET" --force
          else
            python -m backend.utils.log.shared_cleanup --target "$TARGET"
          fi
