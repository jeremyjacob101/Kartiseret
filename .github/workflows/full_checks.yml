name: Full checks

on:
  pull_request: {}
  push: {}
  repository_dispatch:
    types: [license-year-updated]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify web application
        run: npm run verify:code

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.2"

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Install backend test dependencies
        run: python -m pip install -r requirements.txt

      - name: Test dataflow requests and publication
        run: python -m unittest discover -s backend/tests -v

  api-postgres:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build safeupdate for production-compatible publication tests
        shell: bash
        run: |
          set -euo pipefail
          build_dir="$(mktemp -d)"
          cd "$build_dir"
          curl --fail --location --retry 3 https://ftp.postgresql.org/pub/source/v17.6/postgresql-17.6.tar.bz2 -o postgres.tar.bz2
          echo 'e0630a3600aea27511715563259ec2111cd5f4353a4b040e0be827f94cd7a8b0  postgres.tar.bz2' | sha256sum --check
          curl --fail --location --retry 3 https://raw.githubusercontent.com/eradman/pg-safeupdate/37dbc9c4acf5e2504adf2b218e9c6b41751022f3/safeupdate.c -o safeupdate.c
          echo '1351fc18b9a1e2dcc72185d349c178244458b5d9eb30007609c3d599b38aeb38  safeupdate.c' | sha256sum --check
          tar -xjf postgres.tar.bz2
          cd postgresql-17.6
          ./configure --without-icu --without-readline --without-zlib
          make -C src/backend generated-headers
          cc -shared -fPIC -I src/include ../safeupdate.c -o "$build_dir/safeupdate.so"
          echo "TEST_SAFEUPDATE_LIBRARY=$build_dir/safeupdate.so" >> "$GITHUB_ENV"

      - name: Run API integration tests against disposable PostgreSQL 17
        run: npm run api:test:integration

      - name: Install Chromium for browser acceptance
        run: npx playwright install --with-deps chromium

      - name: Run the frontend against the real Express API and PostgreSQL fixture
        run: npm run web:e2e

  production-gate:
    # Require this GitHub check as a Vercel Production Deployment Check.
    # Vercel can build in parallel, but must wait before assigning production domains.
    if: always()
    needs:
      - web
      - backend
      - api-postgres
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          WEB_RESULT: ${{ needs.web.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          API_POSTGRES_RESULT: ${{ needs['api-postgres'].result }}
        run: |
          set -euo pipefail
          if [[ "$WEB_RESULT" != "success" || "$BACKEND_RESULT" != "success" || "$API_POSTGRES_RESULT" != "success" ]]; then
            echo "::error::Production is blocked because one or more CI jobs did not pass."
            echo "web=$WEB_RESULT backend=$BACKEND_RESULT api-postgres=$API_POSTGRES_RESULT"
            exit 1
          fi
          echo "All CI jobs passed; production may be promoted."
