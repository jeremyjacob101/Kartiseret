name: Full checks

on:
  pull_request: {}
  push: {}

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Codebase - Kartiseret Web"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "Codebase - Kartiseret Web/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Verify web application
        run: npm run verify

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.2"

      - name: Compile backend
        run: python -m compileall -q backend
