name: Full checks

on:
  pull_request: {}
  push: {}
  repository_dispatch:
    types: [license-year-updated]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify web application
        run: npm run verify

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.2"

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Install backend test dependencies
        run: python -m pip install -r requirements.txt

      - name: Test dataflow requests and publication
        run: python -m unittest discover -s backend/tests -v

  api-postgres:
    needs: web
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kartiseret_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kartiseret_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kartiseret_test
      DATABASE_URL: postgresql://kartiseret_api:local-test-only@127.0.0.1:5432/kartiseret_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap and test against disposable PostgreSQL 17
        run: npm run api:test:integration

      - name: Install Chromium for browser acceptance
        run: npx playwright install --with-deps chromium

      - name: Run the frontend against the real Express API and PostgreSQL fixture
        run: npm run web:e2e

  production-gate:
    # Require this GitHub check as a Vercel Production Deployment Check.
    # Vercel can build in parallel, but must wait before assigning production domains.
    if: always()
    needs:
      - web
      - backend
      - api-postgres
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          WEB_RESULT: ${{ needs.web.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          API_POSTGRES_RESULT: ${{ needs['api-postgres'].result }}
        run: |
          set -euo pipefail
          if [[ "$WEB_RESULT" != "success" || "$BACKEND_RESULT" != "success" || "$API_POSTGRES_RESULT" != "success" ]]; then
            echo "::error::Production is blocked because one or more CI jobs did not pass."
            echo "web=$WEB_RESULT backend=$BACKEND_RESULT api-postgres=$API_POSTGRES_RESULT"
            exit 1
          fi
          echo "All CI jobs passed; production may be promoted."
