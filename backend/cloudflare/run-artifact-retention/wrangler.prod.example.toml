# Fill in the production D1 database UUID only after the production database
# and private R2 bucket have been explicitly provisioned.
name = "kartiseret-run-artifact-retention-prod"
main = "worker.mjs"
compatibility_date = "2026-11-03"
workers_dev = true

[triggers]
crons = ["17 * * * *"]

[[d1_databases]]
binding = "RUN_LOGS"
database_name = "kartiseret-run-logs-prod"
database_id = "REPLACE_WITH_PRODUCTION_D1_DATABASE_ID"

[[r2_buckets]]
binding = "RUN_ARTIFACTS"
bucket_name = "kartiseret-run-artifacts-prod"
