<!doctype html>
<html lang="en" dir="ltr" data-locale="en" data-direction="ltr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      try {
        var locale = window.localStorage.getItem("kartiseret_locale_v1");
        var normalizedLocale = locale === "he" ? "he" : "en";
        var direction = normalizedLocale === "he" ? "rtl" : "ltr";
        var root = document.documentElement;
        root.lang = normalizedLocale;
        root.dir = direction;
        root.dataset.locale = normalizedLocale;
        root.dataset.direction = direction;
        root.style.setProperty("--app-direction", direction);
      } catch (_error) {
        // English/LTR remains the safe default when storage is unavailable.
      }
    })();
  </script>
  <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
  <link rel="dns-prefetch" href="https://image.tmdb.org" />
  <link id="site-favicon" rel="icon" href="/favicon.ico" type="image/x-icon" />
  <script>
    var favicon = document.getElementById("site-favicon");
    if (favicon) {
      favicon.setAttribute("href", "/logos/kartiseret1.svg?v=1");
      favicon.setAttribute("type", "image/svg+xml");
      favicon.setAttribute("sizes", "any");
    }
  </script>

  <meta property="og:locale:alternate" content="he_IL" />

</head>
