name: Kartiseret
options:
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    GOOGLE_IOS_CLIENT_ID: "790310150231-ol12o39i6qe65sjc3g07dc2trabu0kb8.apps.googleusercontent.com"
    GOOGLE_SERVER_CLIENT_ID: "790310150231-907tnl1rvudrpntqi367arr3s2vl5qr7.apps.googleusercontent.com"
    GOOGLE_IOS_REVERSED_CLIENT_ID: "com.googleusercontent.apps.790310150231-ol12o39i6qe65sjc3g07dc2trabu0kb8"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 9.0.0
targets:
  Kartiseret:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Kartiseret
    info:
      path: Kartiseret/Info.plist
      properties:
        CFBundleDisplayName: Kartiseret
        KARTISERET_API_BASE_URL: https://seret.site
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        GIDServerClientID: $(GOOGLE_SERVER_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - $(GOOGLE_IOS_REVERSED_CLIENT_ID)
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jj.kartiseret
        PRODUCT_NAME: Kartiseret
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Kartiseret/Kartiseret.entitlements
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
  KartiseretTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KartiseretTests
    dependencies:
      - target: Kartiseret
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jj.kartiseret.tests
        GENERATE_INFOPLIST_FILE: YES
  KartiseretUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KartiseretUITests
    dependencies:
      - target: Kartiseret
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jj.kartiseret.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Kartiseret:
    build:
      targets:
        Kartiseret: all
        KartiseretTests: [test]
        KartiseretUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: KartiseretTests
          parallelizable: true
        - name: KartiseretUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
