name: Kartiseret
options:
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  indentWidth: 2
  tabWidth: 2
configs:
  Debug: debug
  Release: release
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.46.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
targets:
  Kartiseret:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Kartiseret
    resources:
      - path: Kartiseret/Resources
    dependencies:
      - package: Supabase
        product: Supabase
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jj.kartiseret
        PRODUCT_NAME: Kartiseret
        INFOPLIST_FILE: Kartiseret/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  KartiseretTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KartiseretTests
    dependencies:
      - target: Kartiseret
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jj.kartiseret.tests
        GENERATE_INFOPLIST_FILE: YES
  KartiseretUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KartiseretUITests
    dependencies:
      - target: Kartiseret
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jj.kartiseret.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Kartiseret:
    build:
      targets:
        Kartiseret: all
        KartiseretTests: [test]
        KartiseretUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: KartiseretTests
          parallelizable: true
        - name: KartiseretUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
