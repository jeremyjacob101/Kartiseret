name: Kartiseret
options:
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
targets:
  Kartiseret:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Kartiseret
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jj.kartiseret
        PRODUCT_NAME: Kartiseret
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kartiseret
        INFOPLIST_KEY_KARTISERET_API_BASE_URL: https://seret.site
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  KartiseretTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KartiseretTests
    dependencies:
      - target: Kartiseret
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jj.kartiseret.tests
        GENERATE_INFOPLIST_FILE: YES
  KartiseretUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KartiseretUITests
    dependencies:
      - target: Kartiseret
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jj.kartiseret.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Kartiseret:
    build:
      targets:
        Kartiseret: all
        KartiseretTests: [test]
        KartiseretUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: KartiseretTests
          parallelizable: true
        - name: KartiseretUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
